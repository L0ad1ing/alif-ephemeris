name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: NASA planet file (public domain, cached)
        uses: actions/cache@v4
        id: nasa
        with:
          path: data/raw/de440.bsp
          key: de440-bsp
      - name: Download the planet file
        if: steps.nasa.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/raw
          curl -L -o data/raw/de440.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp
      - name: Tests
        run: python -m pytest -q
